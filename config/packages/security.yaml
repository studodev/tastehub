security:
    access_decision_manager:
        strategy: unanimous

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\EntryPoint\MainEntryPoint
            access_denied_handler: App\Security\Handler\AccessDeniedHandler
            form_login:
                login_path: user_security_login
                check_path: user_security_login
                enable_csrf: true
            logout:
                path: /deconnexion
            remember_me:
                secret: '%kernel.secret%'
                name: KEEPLOGIN
                lifetime: 2592000
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
